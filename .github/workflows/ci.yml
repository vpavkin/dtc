name: DTC CI
on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

jobs:
  build:
    name: Build (Scala ${{ matrix.scala }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # keep in sync with crossScalaVersions in build.sbt
        scala: [ "2.13.18", "3.3.8" ]
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: sbt

      - name: Setup SBT
        uses: sbt/setup-sbt@v1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Compile, test and check binary compatibility
        run: sbt ++${{ matrix.scala }} clean validate

  dependency-graph:
    name: Update Dependency Graph
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: sbt

      - name: Setup SBT
        uses: sbt/setup-sbt@v1

      - uses: scalacenter/sbt-dependency-submission@v2
